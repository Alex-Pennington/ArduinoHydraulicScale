;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps =
  # RECOMMENDED
  # Accept new functionality in a backwards compatible manner and patches
  arduino-libraries/ArduinoMqttClient @ ^0.1.8

; The LCD2004A is driven directly over I2C (Wire1) by include/lcd2004.h, not
; through the LiquidCrystal library -- that dependency left with the 16x2
; parallel shield.
; WiFiS3 and WDT ship with the renesas-ra core and need no lib_deps entry.
; arduino_secrets.h is gitignored and absent; copy arduino_secrets.h.example
; to src/ or include/ and fill it in before building.
