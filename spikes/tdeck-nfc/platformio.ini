; THROWAWAY SPIKE. Not PLC #4 firmware and not the pendant. See README.md.
; Original LilyGO T-Deck (not Plus) + Elechouse PN532 NFC module V3 in HSU (UART) mode on the
; T-Deck's Grove plug.

[env:tdeck-nfc]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    adafruit/Adafruit PN532@1.3.4
